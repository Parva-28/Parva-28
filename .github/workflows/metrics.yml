name: Metrics
on:
  # Every day at 06:47 IST (cron runs in UTC)
  schedule: [{cron: "17 1 * * *"}]
  # Run it by hand from the Actions tab
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          # Fail the run instead of committing an image with an error message in it
          plugins_errors_fatal: yes

          # Header and footer only: the other base sections are mostly zeros for now
          base: header, metadata

          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile
          plugin_languages_details: percentage
          plugin_languages_limit: 6

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
